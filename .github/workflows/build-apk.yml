name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Install Dependencies
        run: |
          npm install @bubblewrap/core

      - name: Run Bubblewrap Core Build Script
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          node build.js

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-Files
          path: |
            *.aab
            *.apk
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
          if-no-files-found: warn