name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate TWA Project & Build
        run: |
          npx @bubblewrap/cli init --manifest="https://supermarket-tau.vercel.app/manifest.json" --directory="./twa-project" --skipPrompt || true
          if [ -d "./twa-project" ]; then
            cd twa-project
            npx @bubblewrap/cli build --signingKeyPath=../android.keystore --signingKeyAlias="${{ secrets.RELEASE_KEY_ALIAS }}" --signingKeyPassword="${{ secrets.RELEASE_KEY_PASSWORD }}" --signingStorePassword="${{ secrets.RELEASE_STORE_PASSWORD }}"
            cp *.aab ../ || true
            cp *.apk ../ || true
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-Files
          path: |
            *.aab
            *.apk