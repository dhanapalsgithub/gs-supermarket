name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Generate Android App Package
        uses: pwa-builder/pwa-action@v1.0.3
        with:
          manifest-url: 'https://supermarket-tau.vercel.app/manifest.json'
          signing-key-path: 'release.keystore'
          signing-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          signing-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
          signing-store-password: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-Files
          path: |
            *.aab
            *.apk