name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android.keystore

      - name: Build Android Package via PWABuilder Action
        uses: pwa-builder/pwa-action@v1
        with:
          manifest-url: 'https://supermarket-tau.vercel.app/manifest.json'
          signing-key-path: 'android.keystore'
          signing-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          signing-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
          signing-store-password: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: App-Release-Files
          path: |
            *.aab
            *.apk