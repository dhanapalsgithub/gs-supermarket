name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi

          python3 -c "import base64, os; s=os.environ['KEYSTORE_BASE64'].strip(); s += '=' * (-len(s) % 4); open('release.keystore', 'wb').write(base64.b64decode(s))"

          if [ ! -s release.keystore ]; then
            echo "Error: Keystore file decoding produced an empty file."
            exit 1
          fi
          echo "Keystore successfully decoded!"

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli

      - name: Setup Bubblewrap Config & Android SDK
        run: |
          mkdir -p ~/.bubblewrap

          # Locate standard GitHub Actions Android SDK Path
          SDK_PATH="$ANDROID_HOME"
          if [ -z "$SDK_PATH" ] || [ ! -d "$SDK_PATH" ]; then
            SDK_PATH="$ANDROID_SDK_ROOT"
          fi
          if [ -z "$SDK_PATH" ] || [ ! -d "$SDK_PATH" ]; then
            SDK_PATH="/usr/local/lib/android/sdk"
          fi

          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${SDK_PATH}"
          }
          EOF

          echo "Bubblewrap config created successfully."
          echo "Using JDK: ${JAVA_HOME}"
          echo "Using Android SDK: ${SDK_PATH}"

      - name: Run Core Build Script
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          node build.js

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-Files
          path: |
            *.aab
            *.apk
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
          if-no-files-found: warn