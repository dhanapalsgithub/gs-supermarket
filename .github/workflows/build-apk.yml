name: Build Android App Bundle (AAB) & APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap Environment
        run: |
          npx bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Generate Android Project Files
        run: |
          yes | npx bubblewrap update --manifest=./ || true

      - name: Build Signed Android Package
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          npx bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath=release.keystore \
            --signingKeyAlias="${{ secrets.RELEASE_KEY_ALIAS }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-Files
          path: |
            *.aab
            *.apk
          if-no-files-found: warn